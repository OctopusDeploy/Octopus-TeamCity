apply plugin: 'distribution'

tasks.named('jar') {
  archiveBaseName = 'octopus-teamcity-agent'
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': project.version
      )
  }
}

dependencies {
  provided files('./libs/agent.jar')
  provided 'org.jetbrains.teamcity:agent-api'
  implementation 'org.apache.commons:commons-compress:1.26.0'
  implementation 'org.apache.commons:commons-lang3:3.18.0'
  implementation 'com.google.code.gson:gson'
  implementation project(':octopus-common')
  implementation 'org.jetbrains.teamcity:teamcity-rest-client'
  implementation 'com.google.code.gson:gson'
  implementation 'com.google.guava:guava'
  implementation 'org.apache.logging.log4j:log4j-api'
  implementation 'org.apache.logging.log4j:log4j-core'
  implementation 'commons-io:commons-io'

  testImplementation 'org.jetbrains.teamcity:agent-api'
  testImplementation files('./libs/agent.jar')
  testImplementation 'org.junit.jupiter:junit-jupiter-api'
  testImplementation 'org.junit.jupiter:junit-jupiter-params'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
  testRuntimeOnly 'org.jetbrains.teamcity:agent-api'

  //testImplementation group: 'com.octopus', name:'dsl', classifier: 'test-support'
}

def octopusCliVersion = project.property('octopusCliVersion')
def octopusCliArchives = [
  'windows-os-amd64': [name: "octopus_${octopusCliVersion}_windows_amd64.zip", sha256: project.property('octopusCliSha256WindowsAmd64')],
  'windows-os-arm64': [name: "octopus_${octopusCliVersion}_windows_arm64.zip", sha256: project.property('octopusCliSha256WindowsArm64')],
  'unix-os-amd64': [name: "octopus_${octopusCliVersion}_linux_amd64.tar.gz", sha256: project.property('octopusCliSha256LinuxAmd64')],
  'unix-os-arm64': [name: "octopus_${octopusCliVersion}_linux_arm64.tar.gz", sha256: project.property('octopusCliSha256LinuxArm64')],
  'mac-os-amd64': [name: "octopus_${octopusCliVersion}_macOS_amd64.tar.gz", sha256: project.property('octopusCliSha256MacOsAmd64')],
  'mac-os-arm64': [name: "octopus_${octopusCliVersion}_macOS_arm64.tar.gz", sha256: project.property('octopusCliSha256MacOsArm64')],
]
def octopusCliResourcesDir = layout.buildDirectory.dir('generated/octopus-cli')

task downloadOctopusCli {
  description = 'Downloads the Octopus CLI archives bundled in the agent and verifies their SHA-256 hashes.'
  inputs.property('archives', octopusCliArchives.collectEntries { osFolder, archive -> [(osFolder): archive.toString()] })
  outputs.dir(octopusCliResourcesDir)

  doLast {
    def outputRoot = octopusCliResourcesDir.get().asFile
    project.delete(outputRoot)
    octopusCliArchives.each { osFolder, archive ->
      def target = new File(outputRoot, "resources/newcli/2.0/${osFolder}/${archive.name}")
      target.parentFile.mkdirs()
      def url = "https://github.com/OctopusDeploy/cli/releases/download/v${octopusCliVersion}/${archive.name}"
      logger.lifecycle("Downloading ${url}")
      new URL(url).withInputStream { input ->
        target.withOutputStream { output ->
          output << input
        }
      }

      def actualSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
      if (actualSha256 != archive.sha256) {
        target.delete()
        throw new GradleException("SHA-256 of ${archive.name} is ${actualSha256}, expected ${archive.sha256}")
      }
    }
  }
}

sourceSets.main.resources.srcDir(files(octopusCliResourcesDir).builtBy(downloadOctopusCli))

distZip {
  archiveFileName = "Octopus.TeamCity.zip"
}

distributions {
  main {
    contents {
      into '/'
      into('/lib/') {
        from configurations.runtimeClasspath
        from jar
      }
      from file("teamcity-plugin.xml")

      // teamcity-rest-client pulls in slf4j-api which then conflicts with the literal TeamCity agent's class
      // loader - only solution seems to be to explicitly exclude this file (ideally here, rather than in
      // the API wrapper)
      exclude("**/slf4j-api*")
    }
  }
}
